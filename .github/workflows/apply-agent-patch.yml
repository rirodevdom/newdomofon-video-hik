name: Apply pairing implementation

on:
  push:
    branches: ['agent/manual-master-pairing']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manual-master-pairing
          fetch-depth: 0
      - name: Apply implementation
        run: |
          # Decode the reviewed patch staged by the agent.
          base64 -d .github/agent.patch.gz.b64 | gzip -dc > /tmp/agent.patch
          git apply --index /tmp/agent.patch
          git rm .github/agent.patch.gz.b64 .github/workflows/apply-agent-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Implement manual master pairing for Hikvision node"
          git push origin HEAD:agent/manual-master-pairing
