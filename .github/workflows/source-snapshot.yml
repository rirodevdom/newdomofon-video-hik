name: Temporary source snapshot

on:
  push:
    branches: ['agent/manual-master-pairing']
  pull_request:
    branches: [main]

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: hikvision-node-source
          path: .
          include-hidden-files: true
          retention-days: 1
