name: Hikvision node CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shell
        run: |
          bash -n scripts/install.sh
          bash -n scripts/update-installed-project.sh
      - name: Install locked dependencies
        run: |
          gzip -dc package-lock.json.gz > package-lock.json
          npm ci
      - name: Build and test
        env:
          HIK_NODE_TOKEN: ci-control-token-0123456789
          HIK_NODE_MEDIA_SECRET: ci-media-secret-0123456789
          HIK_NODE_STATE_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          HIK_NODE_ROOT: ${{ runner.temp }}/newdomofon-video-hik
        run: npm run check
