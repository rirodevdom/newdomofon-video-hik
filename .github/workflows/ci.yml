name: Hikvision node CI

on:
  push:
    branches: [main, 'agent/**', 'feature/native-hcnet-sdk']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate installer and pairing contract
        run: |
          bash -n scripts/install.sh
          bash -n scripts/update-installed-project.sh
          bash scripts/install.sh --help >/tmp/hik-install-help.txt
          grep -q -- '--master-url' /tmp/hik-install-help.txt
          grep -q -- '--node-id' /tmp/hik-install-help.txt
          grep -q -- '--node-token' /tmp/hik-install-help.txt
          grep -q -- '--media-secret' /tmp/hik-install-help.txt
          grep -q 'newdomofon-hik-master-registration.env' scripts/install.sh
          grep -q 'NODE_KIND=hikvision' scripts/install.sh
          grep -q 'DVR_MASTER_URL=' deploy/env/app.env.example
          grep -q 'DVR_NODE_ID=' deploy/env/app.env.example
          grep -q 'DVR_NODE_TOKEN=' deploy/env/app.env.example
          grep -q 'DVR_NODE_MEDIA_SECRET=' deploy/env/app.env.example
          grep -q 'agentDerivedMediaSecret' src/http/mediaToken.ts
          test -s test/http/mediaToken.test.ts
          test -s docs/MANUAL_MASTER_PAIRING.md
      - name: Validate native HCNetSDK transport source
        run: |
          bash -n scripts/install-hcnet-sdk-local.sh
          bash -n scripts/rebuild-hcnet-sdk-worker.sh
          bash -n scripts/verify-hcnet-sdk-runtime.sh
          bash -n scripts/test-hcnet-sdk-device.sh
          python3 -m py_compile scripts/validate-native-sdk-source.py
          python3 scripts/validate-native-sdk-source.py
          test -s native-sdk/hik_sdk_worker.cpp
          test -s native-sdk/hik_sdk_device_worker.cpp
          grep -q 'login.byLoginMode = 0' native-sdk/hik_sdk_worker.cpp
          grep -q 'NET_DVR_PLAYSETTIME' native-sdk/hik_sdk_worker.cpp
          grep -q 'NET_DVR_SetupAlarmChan_V41' native-sdk/hik_sdk_worker.cpp
          grep -q 'COMM_ALARM_V30' native-sdk/hik_sdk_worker.cpp
          grep -q 'HIK_SDK_DEVICE_LIVE_CONFIG' native-sdk/hik_sdk_device_worker.cpp
          grep -q 'NET_DVR_RealPlay_V40' native-sdk/hik_sdk_device_worker.cpp
          grep -q 'verify-hcnet-sdk-runtime.sh' scripts/rebuild-hcnet-sdk-worker.sh
          grep -q 'sync_errors' scripts/update-installed-project.sh
          grep -q 'live_devices_expected' scripts/update-installed-project.sh
          grep -q 'live_devices_ready' scripts/update-installed-project.sh
      - name: Validate fast media source patch
        run: |
          python3 -m py_compile scripts/patch-fast-media-startup.py
          python3 scripts/patch-fast-media-startup.py --project-dir .
          before="$(sha256sum src/config.ts src/media/rtsp.ts src/media/recorderManager.ts src/archive/deviceArchive.ts src/archive/deviceArchiveSessions.ts | sha256sum | awk '{print $1}')"
          python3 scripts/patch-fast-media-startup.py --project-dir .
          after="$(sha256sum src/config.ts src/media/rtsp.ts src/media/recorderManager.ts src/archive/deviceArchive.ts src/archive/deviceArchiveSessions.ts | sha256sum | awk '{print $1}')"
          test "$before" = "$after"
          grep -q "hls_segment_type', 'fmp4" src/archive/deviceArchiveSessions.ts
          grep -q "selectLiveStreamId" src/media/recorderManager.ts
          grep -q "archiveRangeCacheMs" src/archive/deviceArchive.ts
      - name: Validate media readiness source patch
        run: |
          python3 -m py_compile scripts/patch-media-readiness.py
          python3 scripts/patch-media-readiness.py --project-dir .
          before="$(sha256sum src/http/mediaRoutes.ts src/index.ts | sha256sum | awk '{print $1}')"
          python3 scripts/patch-media-readiness.py --project-dir .
          after="$(sha256sum src/http/mediaRoutes.ts src/index.ts | sha256sum | awk '{print $1}')"
          test "$before" = "$after"
          grep -q 'CHANNEL_READY_TIMEOUT_MS = 20_000' src/http/mediaRoutes.ts
          grep -q 'waitForLivePlaylist' src/http/mediaRoutes.ts
          grep -q 'live_expected' src/index.ts
          grep -q 'live_ready' src/index.ts
          grep -q 'live_devices_expected' src/index.ts
          grep -q 'live_devices_ready' src/index.ts
          grep -q 'live_unready' src/index.ts
      - name: Validate native SDK runtime patch
        run: |
          python3 -m py_compile scripts/patch-native-sdk-media-runtime.py
          python3 scripts/patch-native-sdk-media-runtime.py --project-dir .
          before="$(sha256sum src/http/mediaRoutes.ts src/index.ts src/service.ts | sha256sum | awk '{print $1}')"
          python3 scripts/patch-native-sdk-media-runtime.py --project-dir .
          after="$(sha256sum src/http/mediaRoutes.ts src/index.ts src/service.ts | sha256sum | awk '{print $1}')"
          test "$before" = "$after"
          grep -q 'newdomofon-hik-native-sdk-media-runtime' src/http/mediaRoutes.ts
          grep -q 'NativeSdkArchiveSessionManager' src/index.ts
          grep -q 'NativeSdkEventCollector' src/index.ts
          grep -q 'sync_errors' src/index.ts
          grep -q 'await discoverNativeHikvisionDevice' src/service.ts
          grep -q "transport: 'hcnet-private-sdk'" src/nativeSdk/discovery.ts
          ! grep -R -E '/ISAPI/|rtsp://' src/nativeSdk native-sdk/hik_sdk_worker.cpp native-sdk/hik_sdk_device_worker.cpp
      - name: Install locked dependencies
        run: |
          gzip -dc package-lock.json.gz > package-lock.json
          npm ci
      - name: Build and test
        env:
          DVR_MASTER_URL: https://video-master.example.com
          DVR_NODE_ID: 11111111-2222-4333-8444-555555555555
          DVR_NODE_TOKEN: ci-control-token-0123456789
          DVR_NODE_MEDIA_SECRET: ci-media-secret-0123456789
          DVR_NODE_PUBLIC_BASE_URL: http://192.0.2.41:3020
          DVR_NODE_INTERNAL_URL: http://192.0.2.41:3020
          HIK_NODE_STATE_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          HIK_NODE_ROOT: ${{ runner.temp }}/newdomofon-video-hik
        run: npm run check
